<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IDDS — Proje Görselleri</title>
<style>
*{box-sizing:border-box}html{color-scheme:light}body{margin:0;background:#fafaf8;color:#1d2429;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header,main{max-width:1200px;margin:auto;padding-inline:32px}header{padding-top:64px;padding-bottom:44px}h1{font-size:clamp(26px,4vw,42px);line-height:1.2;font-weight:600;letter-spacing:-.04em;margin:0}main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:56px 28px;padding-bottom:72px}figure{margin:0;min-width:0}.wide{grid-column:1/-1}.images{overflow:hidden;background:#f0f1ef;border-radius:4px}.images>a{display:block}.images img{display:block;width:100%;height:auto}.images>a:focus-visible{outline:4px solid #00758b;outline-offset:-4px}.with-detail{display:grid;grid-template-columns:minmax(0,1fr) 220px;align-items:center;gap:24px;padding-right:24px}.detail img{image-rendering:auto}figcaption{padding-top:16px}h2{font-size:18px;line-height:1.4;font-weight:600;margin:0}p{font-size:15px;line-height:1.6;color:#5b6267;margin:5px 0 0;max-width:850px}@media(min-width:800px){.wide .images:not(.with-detail)>a>img{max-height:860px;object-fit:contain}.images.with-detail>a:first-child img{max-height:760px;object-fit:contain}}@media(max-width:640px){header,main{padding-inline:18px}header{padding-top:32px;padding-bottom:30px}main{grid-template-columns:1fr;gap:36px;padding-bottom:40px}.wide{grid-column:auto}.with-detail{grid-template-columns:minmax(0,1fr) 100px;gap:10px;padding-right:10px}h2{font-size:17px}p{font-size:14px}}@media print{body{background:white}header{padding-top:10px}figure{break-inside:avoid}main{gap:24px}.images img{max-height:450px;object-fit:contain}}
</style>
</head>
<body>
<header><h1>IDDS — Proje Görselleri</h1></header>
<main><figure class="wide"><div class="images"><a href="assets/01_istasyon.png" target="_blank" rel="noopener" aria-label="İnceleme istasyonu — tam boy aç"><img src="assets/01_istasyon.png" width="720" height="380" alt="İnceleme istasyonu" fetchpriority="high" decoding="async"></a></div><figcaption><h2>İnceleme istasyonu</h2><p>Gazebo’daki açık istasyon tasarımı, konveyörleri ve taşıyıcı yapıyı gösteriyor.</p></figcaption></figure><figure class="wide"><div class="images"><a href="assets/12_konveyor.png" target="_blank" rel="noopener" aria-label="Konveyör geçiş bölgesi — tam boy aç"><img src="assets/12_konveyor.png" width="610" height="235" alt="Konveyör geçiş bölgesi" loading="lazy" decoding="async"></a></div><figcaption><h2>Konveyör geçiş bölgesi</h2><p>Tabak, iki bant arasındaki inceleme bölgesinden taşınıyor.</p></figcaption></figure><figure class="wide"><div class="images"><a href="assets/02_kamera_gorusleri.png" target="_blank" rel="noopener" aria-label="Dört yönden kamera görüntüleri — tam boy aç"><img src="assets/02_kamera_gorusleri.png" width="1040" height="680" alt="Dört yönden kamera görüntüleri" loading="lazy" decoding="async"></a></div><figcaption><h2>Dört yönden kamera görüntüleri</h2><p>Üst, sol, sağ ve alt kameraların farklı anlarda kaydettiği simülasyon görüntüleri.</p></figcaption></figure><figure class=""><div class="images"><a href="assets/03_saglikli_duz.png" target="_blank" rel="noopener" aria-label="Sağlıklı düz tabak — tam boy aç"><img src="assets/03_saglikli_duz.png" width="340" height="253" alt="Sağlıklı düz tabak" loading="lazy" decoding="async"></a></div><figcaption><h2>Sağlıklı düz tabak</h2><p>Dilimli kenar ve kabartmalar, normal ürün geometrisinin parçası.</p></figcaption></figure><figure class=""><div class="images"><a href="assets/04_saglikli_desenli.png" target="_blank" rel="noopener" aria-label="Sağlıklı desenli tabak — tam boy aç"><img src="assets/04_saglikli_desenli.png" width="340" height="253" alt="Sağlıklı desenli tabak" loading="lazy" decoding="async"></a></div><figcaption><h2>Sağlıklı desenli tabak</h2><p>Mavi baskılı tasarım, desenli ürün incelemesinde sağlıklı örnek olarak kullanılıyor.</p></figcaption></figure><figure class="wide"><div class="images"><a href="assets/07_kenar_kirigi.png" target="_blank" rel="noopener" aria-label="Kenar kırığının tespiti — tam boy aç"><img src="assets/07_kenar_kirigi.png" width="670" height="650" alt="Kenar kırığının tespiti" loading="lazy" decoding="async"></a></div><figcaption><h2>Kenar kırığının tespiti</h2><p>Kırmızı kutu, Gazebo testinde belirlenen küçük kenar kaybını gösteriyor.</p></figcaption></figure><figure class="wide"><div class="images with-detail"><a href="assets/08_catlak_tespit_karesi.png" target="_blank" rel="noopener" aria-label="Tabak üzerinde çatlak izi — tam boy aç"><img src="assets/08_catlak_tespit_karesi.png" width="2560" height="1920" alt="Tabak üzerinde çatlak izi" loading="lazy" decoding="async"></a><a class="detail" href="assets/08_catlak_yakin_plan.png" target="_blank" rel="noopener" aria-label="Çatlak izini tam boy aç"><img src="assets/08_catlak_yakin_plan.png" width="180" height="180" alt="Aynı kaynak karede çatlak izi ve tespit kutusunun yakın planı" loading="lazy"></a></div><figcaption><h2>Tabak üzerinde çatlak izi</h2><p>Kaydedilmiş Gazebo karesindeki kırmızı kutu, algoritmanın tespit ettiği görünür çatlak izini gösteriyor.</p></figcaption></figure><figure class="wide"><div class="images"><a href="assets/05_kusur_ornekleri.png" target="_blank" rel="noopener" aria-label="Farklı kusurların tespiti — tam boy aç"><img src="assets/05_kusur_ornekleri.png" width="1040" height="1150" alt="Farklı kusurların tespiti" loading="lazy" decoding="async"></a></div><figcaption><h2>Farklı kusurların tespiti</h2><p>Simülasyonda leke, çizik ve çatlak izi örnekleri; kırmızı kutular algoritma tespitlerini gösteriyor.</p></figcaption></figure><figure class="wide"><div class="images"><a href="assets/09_alt_yuzey_ayak.png" target="_blank" rel="noopener" aria-label="Alt yüzey ve ayak halkası — tam boy aç"><img src="assets/09_alt_yuzey_ayak.png" width="1040" height="570" alt="Alt yüzey ve ayak halkası" loading="lazy" decoding="async"></a></div><figcaption><h2>Alt yüzey ve ayak halkası</h2><p>Alt yüzeydeki lekeler ve ayak duvarlarındaki çizikler farklı görüşlerden inceleniyor.</p></figcaption></figure><figure class="wide"><div class="images"><a href="assets/10_geometri_duzeltmesi.png" target="_blank" rel="noopener" aria-label="Yanlış alarmın giderilmesi — tam boy aç"><img src="assets/10_geometri_duzeltmesi.png" width="2388" height="413" alt="Yanlış alarmın giderilmesi" loading="lazy" decoding="async"></a></div><figcaption><h2>Yanlış alarmın giderilmesi</h2><p>Aynı kaynak görüntüde, geometri düzeltmesi sonrası kenardaki yanlış tespit kayboluyor.</p></figcaption></figure></main>
</body>
